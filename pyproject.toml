[project]
name = "ai-project-manager"
version = "1.0.3"
description = "AI项目管家 - 给外部 Agent 使用的个人项目经理工程框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
]

[project.scripts]
apm-export = "app.agent_tools:main_export"
apm-apply = "app.agent_tools:main_apply"
apm-feedback-report = "app.agent_tools:cmd_feedback_report"
apm-doctor = "app.agent_tools:cmd_doctor"
apm-verify = "app.agent_tools:main_verify"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
